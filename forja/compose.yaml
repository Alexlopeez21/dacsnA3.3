services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    ports:
      - "${PUERTO:-3000}:3000"
      - "${PUERTO_SSH:-2222}:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db
      - FORGEJO__database__NAME=${DB_NAME:-dbname}
      - FORGEJO__database__USER=${DB_USER:-dbuser}
      - FORGEJO__database__PASSWD=${DB_PASSWD:?Falta la contraseña en el fichero .env}
      - FORGEJO__server__DOMAIN=${DIRECCION:?Falta la direccion en el fichero .env}
      - FORGEJO__server__ROOT_URL=http://${DIRECCION:?Falta la direccion en el fichero .env}:${PUERTO:?Falta el puerto en el fichero .env}
      - FORGEJO__server__SSH_PORT=${PUERTO_SSH:-2222}
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__mailer__ENABLED=true
      - FORGEJO__mailer__PROTOCOL=smtp
      - FORGEJO__mailer__SMTP_ADDR=correo
      - FORGEJO__mailer__SMTP_PORT=1025
      - FORGEJO__mailer__FROM=forgejo@example.com
      - FORGEJO__cache__ADAPTER=redis
      - FORGEJO__cache__HOST=redis://:${REDIS_CONTRASENA}@cache:6379
      - FORGEJO__session__PROVIDER=redis
      - FORGEJO__session__PROVIDER_CONFIG=redis://:${REDIS_CONTRASENA}@cache:6379
      - FORGEJO__queue__TYPE=redis
      - FORGEJO__queue__CONN_STR=redis://:${REDIS_CONTRASENA}@cache:6379
    volumes:
      - volumenForgejo:/data
    networks:
      - forgejo
    restart: unless-stopped

  db:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=${DB_USER:-dbuser}
      - POSTGRES_PASSWORD=${DB_PASSWD:?Falta la contraseña en el fichero .env}
      - POSTGRES_DB=${DB_NAME:-dbname}
    networks:
      - forgejo
    volumes:
      - volumenDatabase:/var/lib/postgresql

  cache:
    image: redis:7.2
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?falta en el fichero .env}
    volumes:
      - cache-datos:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - forgejo

  correo:
    image: axllent/mailpit:v1.32
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    networks:
      - forgejo
    restart: unless-stopped

volumes:
  volumenForgejo:
  volumenDatabase:
  cache-datos:

networks:
  forgejo:
